apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-tools
  namespace: flock-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-tools
  template:
    metadata:
      labels:
        app: dev-tools
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: regcred
      containers:
        - name: dev-tools
          image: registry.home.ima.dev/flock:staging
          imagePullPolicy: Always
          command: ["node", "apps/dev-tools/.next/standalone/apps/dev-tools/server.js"]
          envFrom:
            - configMapRef:
                name: flock-env
            - secretRef:
                name: flock-secrets
          env:
            # Next standalone server.js reads PORT/HOSTNAME at boot.
            - name: PORT
              value: "3100"
            - name: HOSTNAME
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
