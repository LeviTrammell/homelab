apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
  namespace: agents
  annotations:
    tailscale.com/hostname: agents
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: agent-gateway
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
