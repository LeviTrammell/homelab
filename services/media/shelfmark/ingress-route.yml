apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shelfmark
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`shelfmark.home.ima.dev`)
      kind: Rule
      services:
        - kind: Service
          name: shelfmark
          namespace: media
          passHostHeader: true
          port: 8084
  tls:
    secretName: shelfmark-home-tls-certificate
