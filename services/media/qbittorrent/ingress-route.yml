apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qbittorrent.home.ima.dev`)
      kind: Rule
      services:
        - kind: Service
          name: qbittorrent
          namespace: media
          passHostHeader: true
          port: 8080
  tls:
    secretName: qbittorrent-home-tls-certificate
