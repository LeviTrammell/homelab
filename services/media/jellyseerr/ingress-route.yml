apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyseerr.home.ima.dev`)
      kind: Rule
      services:
        - kind: Service
          name: jellyseerr
          namespace: media
          passHostHeader: true
          port: 5055
  tls:
    secretName: jellyseerr-home-tls-certificate
