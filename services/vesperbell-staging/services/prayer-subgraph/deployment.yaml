apiVersion: apps/v1
kind: Deployment
metadata:
  name: prayer-subgraph
  namespace: flock-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prayer-subgraph
  template:
    metadata:
      labels:
        app: prayer-subgraph
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: regcred
      containers:
        - name: prayer-subgraph
          image: registry.home.ima.dev/flock:staging
          imagePullPolicy: Always
          command: ["node", "apps/prayer-subgraph/dist/index.js"]
          envFrom:
            - configMapRef:
                name: flock-env
            - secretRef:
                name: flock-secrets
          ports:
            - name: http
              containerPort: 4007
          readinessProbe:
            httpGet:
              path: /health
              port: 4007
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4007
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
