apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
  namespace: searxng
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  routes:
    - match: Host(`searxng.home.ima.dev`)
      kind: Rule
      services:
        - kind: Service
          name: searxng
          namespace: searxng
          passHostHeader: true
          port: 8080
  tls:
    secretName: searxng-home-ima-dev-tls

