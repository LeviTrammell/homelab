---
name: Agent images
on:
  schedule:
    - cron: '05 10 * * 0' # 10:05am UTC every Sunday
  push:
    paths:
      - 'services/agents/images/**'
      - 'services/agents/bin/agent'
      - '.github/workflows/agent-images.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent-coding
            containerfile: ./services/agents/images/agent-coding/Containerfile
            context: ./services/agents/images/agent-coding
          - image: agent-gateway
            containerfile: ./services/agents/images/agent-gateway/Containerfile
            context: ./services/agents

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@v8

      - name: Install Podman and Buildah
        run: sudo apt update && sudo apt install -y buildah podman

      - name: Image Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/levitrammell/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          oci: false
          context: ${{ matrix.context }}
          containerfiles: |
            ${{ matrix.containerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          tags: ${{ steps.meta.outputs.tags }}
